services:
  - type: web
    name: yieldcraft-ai-backend
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install --upgrade pip && pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: ENVIRONMENT
        value: production
      - key: ALLOWED_ORIGINS
        value: '["*"]'
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: FIREBASE_PROJECT_ID
        value: yieldcraft-ai
